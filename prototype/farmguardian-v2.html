<title>팜가디언 화면 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Hallmark · shape: app screen · tone: plain, field-use · anchor hue: 225 · surface: paper */
/* Hallmark · waive 39b · the drug tiles carry a name, a product line and a verdict chip · they are cards a gloved hand taps in the field, not toolbar controls */
/* Hallmark · pre-emit critique: P5 H3 E5 S4 R5 V3 · weakest: V, the chrome is kept plain on purpose so the four checks and their source text carry the screen */
:root{
  --app:#ffffff; --sheet:#ffffff; --sunken:#f3f5f8; --page:#e9edf2;
  --ink:#14171c; --ink-2:#626c7a; --ink-3:#8b95a3; --line:#dfe4ea;
  --accent:#1f4fd8;
  --ok:#0d6b57; --ok-bg:#d9f0e8; --warn:#8a5a00; --warn-bg:#fcefd0;
  --bad:#ab2a30; --bad-bg:#fbe1e2; --unk:#4d5663; --unk-bg:#e3e7ed;
  --m-bg:#49603f; --m-1:#5c7450; --m-2:#6e8460; --m-3:#879a6f;
  --m-4:#a7ab7c; --m-5:#42553c; --m-6:#7b8f66; --m-edge:#f2f4ee;
  --on-accent:#f6f8ff;
  --scrim:rgba(10,13,18,.42);
  --map-ink:#fdfdfb; --map-halo:rgba(16,20,14,.5);
  --shadow:0 -1px 0 rgba(20,23,28,.07),0 -12px 28px rgba(20,23,28,.13);
  --lift-1:0 1px 3px rgba(20,23,28,.14);
  --lift-2:0 2px 10px rgba(20,23,28,.14);
  --lift-3:0 2px 6px rgba(20,23,28,.08),0 18px 50px rgba(20,23,28,.14);
  --f:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --app:#0e1115; --sheet:#171b21; --sunken:#1e232a; --page:#07090c;
  --ink:#e9edf2; --ink-2:#9aa4b2; --ink-3:#6f7987; --line:#2b323b;
  --accent:#7fa2f5;
  --ok:#5fd3b2; --ok-bg:#113128; --warn:#f0c164; --warn-bg:#33280f;
  --bad:#f09097; --bad-bg:#3a1b1e; --unk:#a8b2c0; --unk-bg:#232932;
  --m-bg:#26321f; --m-1:#31412a; --m-2:#3b4b31; --m-3:#49573a;
  --m-4:#5c5f43; --m-5:#222c1d; --m-6:#425035; --m-edge:#aab49c;
  --on-accent:#0b1020;
  --scrim:rgba(4,6,10,.62);
  --map-ink:#eef1e6; --map-halo:rgba(0,0,0,.55);
  --shadow:0 -1px 0 rgba(0,0,0,.5),0 -12px 28px rgba(0,0,0,.45);
  --lift-1:0 1px 3px rgba(0,0,0,.5);
  --lift-2:0 2px 10px rgba(0,0,0,.5);
  --lift-3:0 2px 6px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --app:#0e1115; --sheet:#171b21; --sunken:#1e232a; --page:#07090c;
  --ink:#e9edf2; --ink-2:#9aa4b2; --ink-3:#6f7987; --line:#2b323b;
  --accent:#7fa2f5;
  --ok:#5fd3b2; --ok-bg:#113128; --warn:#f0c164; --warn-bg:#33280f;
  --bad:#f09097; --bad-bg:#3a1b1e; --unk:#a8b2c0; --unk-bg:#232932;
  --m-bg:#26321f; --m-1:#31412a; --m-2:#3b4b31; --m-3:#49573a;
  --m-4:#5c5f43; --m-5:#222c1d; --m-6:#425035; --m-edge:#aab49c;
  --on-accent:#0b1020;
  --scrim:rgba(4,6,10,.62);
  --map-ink:#eef1e6; --map-halo:rgba(0,0,0,.55);
  --shadow:0 -1px 0 rgba(0,0,0,.5),0 -12px 28px rgba(0,0,0,.45);
  --lift-1:0 1px 3px rgba(0,0,0,.5);
  --lift-2:0 2px 10px rgba(0,0,0,.5);
  --lift-3:0 2px 6px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;width:100%;overflow-x:clip}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;
  line-height:1.5;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
.switch{flex:none;background:var(--app);border-bottom:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--sunken);border-radius:9px;padding:4px;flex:none}
.tabs button{appearance:none;cursor:pointer;border:0;background:none;color:var(--ink-2);
  font:600 13px/1 var(--f);padding:8px 12px;border-radius:7px;white-space:nowrap}
.tabs button:active{color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--app);color:var(--ink);box-shadow:var(--lift-1)}
.thesis{font-size:12.5px;color:var(--ink-2);min-width:0;flex:1}
@media (max-width:720px){.thesis{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;font-size:11.5px;line-height:1.4}}
.thesis b{color:var(--ink);font-weight:600}
.stage{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;
  padding:12px max(12px,env(safe-area-inset-left,0px)) 12px max(12px,env(safe-area-inset-right,0px))}
.stage.wide{place-items:stretch;padding:0}
.app{width:100%;max-width:392px;height:min(780px,100%);position:relative;overflow:hidden;
  background:var(--app);border:1px solid var(--line);border-radius:18px}
@media (max-width:420px){.stage{padding:0}.app{height:100%;border:0;border-radius:0}}

#map{position:absolute;inset:0}
#map svg{width:100%;height:100%;display:block}
.z-lbl{font:600 13px/1 var(--f);fill:var(--map-ink);paint-order:stroke;stroke:var(--map-halo);stroke-width:3px}
.z-sub{font:500 10.5px/1 var(--f);fill:var(--map-ink);opacity:.9;paint-order:stroke;stroke:var(--map-halo);stroke-width:3px}
.topbar{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;gap:8px;align-items:flex-start}
.pill{background:var(--sheet);border:1px solid var(--line);border-radius:11px;padding:8px 12px;
  box-shadow:var(--lift-2);min-width:0;text-align:left;cursor:pointer;
  appearance:none;color:var(--ink);font-family:var(--f)}
.pill .t{font-weight:600;font-size:14px;line-height:1.25}
.pill .s{font:500 11.5px/1.3 var(--f);color:var(--ink-2)}
.iconbtn{appearance:none;cursor:pointer;flex:none;width:38px;height:38px;border-radius:11px;
  background:var(--sheet);border:1px solid var(--line);color:var(--ink);
  box-shadow:var(--lift-2);display:grid;place-items:center;font:600 11px/1 var(--fm)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn:active{background:var(--sunken)}
.spacer{flex:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:18px 18px 0 0;
  box-shadow:var(--shadow);padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));
  display:grid;gap:8px;max-height:52%;overflow:auto}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line);justify-self:center;margin-bottom:2px}
.sh{display:flex;align-items:baseline;gap:8px}
.sh h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sh .m{font:500 12px/1 var(--f);color:var(--ink-2)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pct{font:500 12px/1 var(--f);color:var(--ink-2);font-variant-numeric:tabular-nums}

.moa{display:inline-flex;border:1.4px solid currentColor;border-radius:3px;overflow:hidden;
  vertical-align:-3px;flex:none}
.moa .kr{font:600 11.5px/1 var(--f);padding:4px 8px;white-space:nowrap}
.moa .in{font:500 11px/1 var(--fm);padding:4px;border-left:1.5px solid currentColor;
  opacity:.8;display:flex;align-items:center}
.btn{appearance:none;cursor:pointer;width:100%;font:600 15px/1 var(--f);padding:12px;border-radius:11px;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px);filter:brightness(.94)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:none;color:var(--accent)}
.empty{font-size:13px;color:var(--ink-2);background:var(--sunken);border-radius:9px;padding:12px;
  border:1px dashed var(--line)}
.chip{font:700 11px/1 var(--f);padding:4px 8px;border-radius:5px;white-space:nowrap}
.chip.GREEN{background:var(--ok-bg);color:var(--ok)}
.chip.AMBER{background:var(--warn-bg);color:var(--warn)}
.chip.RED{background:var(--bad-bg);color:var(--bad)}
.chip.NA{background:var(--unk-bg);color:var(--unk)}
.chip.UNKNOWN{color:var(--unk);outline:1.5px dashed currentColor;outline-offset:-2px;
  background:repeating-linear-gradient(135deg,transparent 0 4px,var(--unk-bg) 4px 8px)}
.evid{font-family:var(--fm);font-size:11px;background:var(--app);border:1px solid var(--line);
  border-radius:7px;padding:8px 8px;color:var(--ink-2);display:grid;gap:2px}
.evid b{color:var(--ink);font-weight:500}
table.ing{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.ing th,table.ing td{padding:4px 4px;text-align:right;border-bottom:1px solid var(--line)}
table.ing th{font:500 11px/1.3 var(--f);color:var(--ink-2)}
table.ing th:first-child,table.ing td:first-child{text-align:left}
table.ing tr:last-child td{border-bottom:0}
table.ing td.out{color:var(--bad);font-weight:600}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink-3);font-size:11.5px}
.sec{font:600 12.5px/1 var(--f);color:var(--ink-2);margin-top:4px}
.toast{background:var(--ok-bg);color:var(--ok);border-radius:11px;padding:12px;font-size:13.5px;
  font-weight:600;text-align:center}
.note{font-size:11px;color:var(--ink-3);text-align:center}
.alt{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:var(--sunken);
  border:1px solid var(--line);border-radius:11px;padding:12px 12px}
.alt .n{font-weight:600;font-size:14.5px}
.alt .w{grid-column:1;font-size:11.5px;color:var(--ink-2)}
.alt .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.panel{position:absolute;inset:0;background:var(--app);color:var(--ink);display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:8px;padding:12px 12px;border-bottom:1px solid var(--line);
  flex:none;background:var(--sheet)}
.phead button{appearance:none;background:none;border:0;cursor:pointer;color:var(--accent);
  font:600 14px/1 var(--f);padding:8px;margin-left:-8px;border-radius:7px}
.phead button:hover{background:var(--sunken)}
.phead h2{margin:0;font-size:15.5px;font-weight:600;flex:1;min-width:0;letter-spacing:-.01em;text-wrap:balance;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{flex:1;overflow:auto;padding:12px;display:grid;gap:12px;align-content:start;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.pfoot{flex:none;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--sheet)}

.pest{appearance:none;cursor:pointer;text-align:left;width:100%;font-family:var(--f);color:var(--ink);
  background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
  display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.pest:hover{border-color:var(--accent)}
.pest:active{background:var(--line)}
.pest .ico{grid-row:1/3;width:40px;height:40px;border-radius:9px;display:block}
.pest .n{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pest .s{grid-column:2;font-size:11px;color:var(--ink-3);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pest .r{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{font:500 11px/1 var(--f);padding:4px 8px;border-radius:4px;background:var(--line);color:var(--ink-2);
  white-space:nowrap}
.tag.alert{background:var(--warn-bg);color:var(--warn);font-weight:600}
.tag.no{background:none;border:1px dashed var(--line);color:var(--ink-3)}
.drug{appearance:none;cursor:pointer;text-align:left;width:100%;font-family:var(--f);color:var(--ink);
  background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:12px;
  display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.drug:hover{border-color:var(--accent)}
.drug:active{background:var(--line)}
.drug .b{font-weight:600;font-size:15.5px}
.drug .p{font-size:11px;color:var(--ink-3);grid-column:1;line-height:1.35}
.drug .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.drug .w{grid-column:1/-1;font-size:12px;color:var(--ink-2);margin-top:8px;padding-top:8px;
  border-top:1px dashed var(--line)}
.vbox{border-radius:12px;padding:12px;display:grid;gap:4px;border:1px solid var(--line);background:var(--sunken)}
.vbox.GREEN{background:var(--ok-bg);border-color:transparent}
.vbox.AMBER{background:var(--warn-bg);border-color:transparent}
.vbox.RED{background:var(--bad-bg);border-color:transparent}
.vbox.UNKNOWN{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--unk-bg) 5px 10px);
  border-style:dashed}
.vbox .vt{font-size:19px;font-weight:700;letter-spacing:-.015em}
.vbox.GREEN .vt{color:var(--ok)}.vbox.AMBER .vt{color:var(--warn)}
.vbox.RED .vt{color:var(--bad)}.vbox.UNKNOWN .vt{color:var(--unk)}
.vbox .vs{font-size:12px;color:var(--ink-2)}
.check{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--sunken)}
.check>summary{cursor:pointer;list-style:none;padding:12px 12px;display:grid;
  grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.check>summary::-webkit-details-marker{display:none}
.check .no{font:700 11px/1 var(--fm);width:20px;height:20px;border-radius:50%;display:grid;
  place-items:center;background:var(--line);color:var(--ink-2)}
.check .tt{min-width:0}
.check .tt b{font-weight:600;font-size:13.5px;display:block}
.check .tt span{color:var(--ink-2);font-size:12px;display:block;margin-top:2px}
.check .bd{padding:12px 12px 12px;border-top:1px dashed var(--line);font-size:12.5px;display:grid;gap:8px}
.cases{display:grid;gap:8px}
.case{appearance:none;cursor:pointer;text-align:left;font-family:var(--f);color:var(--ink);
  background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.case:hover{border-color:var(--accent)}
.case:active{background:var(--line)}
.case .cn{font-weight:600;font-size:13.5px}
.case .cd{grid-column:1;font-size:11px;color:var(--ink-2)}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.seg{display:flex;gap:4px;background:var(--sunken);border-radius:9px;padding:4px}
.seg button{flex:1;appearance:none;cursor:pointer;border:0;background:none;color:var(--ink-2);
  font:600 12.5px/1 var(--f);padding:8px 4px;border-radius:7px;display:grid;gap:4px;justify-items:center}
.seg button[aria-current="true"]{background:var(--app);color:var(--ink);box-shadow:var(--lift-1)}
.seg .zs{font:500 10.5px/1 var(--f);color:var(--ink-3)}
.bwrap{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--app)}
.bhead{flex:none;background:var(--sheet);border-bottom:1px solid var(--line);padding:12px 12px 12px;
  display:grid;gap:8px}
.bhead .r1{display:flex;align-items:center;gap:8px}
.bhead .r1 .t{font-weight:700;font-size:15.5px;flex:1;min-width:0}
.bhead .r1 .back{appearance:none;background:none;border:0;cursor:pointer;color:var(--accent);
  font:600 14px/1 var(--f);padding:4px 8px;margin-left:-8px;border-radius:7px}
.bbody{flex:1;overflow:auto;padding:12px;display:grid;gap:12px;align-content:start;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{appearance:none;cursor:pointer;text-align:left;font-family:var(--f);color:var(--ink);
  background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:12px;
  display:grid;gap:4px;align-content:start}
.tile:hover{border-color:var(--accent)}
.tile:active{background:var(--line)}
.tile .n{font-weight:600;font-size:15px}
.tile .i{font-size:11px;color:var(--ink-2);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .f{display:flex;gap:4px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{appearance:none;cursor:pointer;font-family:var(--f);border:1px solid transparent;border-radius:10px;
  padding:8px 4px 8px;display:grid;gap:4px;justify-items:center;background:var(--sunken);color:var(--ink)}
.cell .cn{font:700 11px/1 var(--f);opacity:.75}
.cell .cl{font-weight:600;font-size:12.5px}
.cell .cv{font:700 11px/1 var(--f)}
.cell.GREEN{background:var(--ok-bg);color:var(--ok)}
.cell.AMBER{background:var(--warn-bg);color:var(--warn)}
.cell.RED{background:var(--bad-bg);color:var(--bad)}
.cell.UNKNOWN{color:var(--unk);border-style:dashed;border-color:currentColor;
  background:repeating-linear-gradient(135deg,transparent 0 5px,var(--unk-bg) 5px 10px)}
.cell[aria-expanded="true"]{outline:2px solid currentColor;outline-offset:-1px}
.cbody{background:var(--sunken);border:1px solid var(--line);border-radius:11px;padding:12px;
  font-size:12.5px;display:grid;gap:8px}
.cbody .ch{font-weight:600;font-size:13px}

.dash{min-height:100%;background:var(--page);display:flex;flex-direction:column}
.dhead{background:var(--app);border-bottom:1px solid var(--line);padding:12px 24px;
  display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.dhead h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.dhead .who{font-size:12.5px;color:var(--ink-2)}
.dhead .env{margin-left:auto;display:flex;gap:16px;font:500 11.5px/1 var(--fm);color:var(--ink-2)}
.dhead .env b{color:var(--ink);font-weight:600}
.dshell{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr) 384px;gap:16px;
  padding:16px 24px 24px;align-items:start}
@media (max-width:1040px){.dshell{grid-template-columns:1fr}}
.dcol{display:grid;gap:8px;align-content:start}
.dlab{font:600 12px/1 var(--f);color:var(--ink-2);margin:0}
.emyun{appearance:none;cursor:pointer;text-align:left;font-family:var(--f);color:var(--ink);width:100%;
  background:var(--app);border:1px solid var(--line);border-radius:11px;padding:12px 12px;
  display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.emyun:hover{border-color:var(--accent)}
.emyun:active{background:var(--sunken)}
.emyun[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.emyun .n{font-weight:600;font-size:14.5px}
.emyun .d{grid-column:1;font-size:11.5px;color:var(--ink-2)}
.rate{font:700 12px/1 var(--fm);padding:4px 8px;border-radius:5px;font-variant-numeric:tabular-nums}
.rate.hi{background:var(--bad-bg);color:var(--bad)}
.rate.mid{background:var(--warn-bg);color:var(--warn)}
.rate.lo{background:var(--ok-bg);color:var(--ok)}
.dcard{background:var(--app);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:16px;display:grid;gap:8px}
.dcard>svg{width:100%;height:auto;display:block;border-radius:9px}
.dtitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

const FIELDS=[{id:1,name:'대관령 윗밭',crop:'배추',
  poly:[[112,148],[286,126],[300,300],[126,322]],
  zones:[
   {id:'A',planted:'2026-08-20',logs:[{d:'2026-09-05',u:5},{d:'2026-09-15',u:4},{d:'2026-09-25',u:4},{d:'2026-10-03',u:1}]},
   {id:'B',planted:'2026-09-01',logs:[]},
   {id:'C',planted:'2026-08-25',logs:[{d:'2026-09-10',u:1},{d:'2026-09-24',u:1}]}]}];
for(const f of FIELDS) for(const z of f.zones) for(const l of z.logs) l.id=LOGSEQ++;
const SEED=JSON.stringify(FIELDS);
const resetAll=()=>{const s=JSON.parse(SEED);FIELDS.length=0;FIELDS.push(...s)};

/* ═══════════ 기하 ═══════════ */
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function clipX(poly,x,right){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const ia=right?a[0]>=x:a[0]<=x, ib=right?b[0]>=x:b[0]<=x;
    if(ia)out.push(a);
    if(ia!==ib&&b[0]!==a[0]){const t=(x-a[0])/(b[0]-a[0]);out.push([x,a[1]+t*(b[1]-a[1])])}
  }
  return out;
}
/* FR-102 균등 분할 — 사각형이면 양 변을 등분, 아니면 x축 등분 후 클리핑 */
function zonePoly(f,i){
  const n=f.zones.length,p=f.poly;
  if(p.length===4){const t0=i/n,t1=(i+1)/n;
    return [lerp(p[0],p[1],t0),lerp(p[0],p[1],t1),lerp(p[3],p[2],t1),lerp(p[3],p[2],t0)];}
  const xs=p.map(q=>q[0]),x0=Math.min(...xs),x1=Math.max(...xs);
  return clipX(clipX(p,x0+(x1-x0)*i/n,true),x0+(x1-x0)*(i+1)/n,false);
}
const area=p=>{let s=0;for(let i=0,j=p.length-1;i<p.length;j=i++)s+=(p[j][0]+p[i][0])*(p[j][1]-p[i][1]);
  return Math.abs(s/2)};
const HA=0.42/area(FIELDS[0].poly);
const ha=p=>area(p)*HA;
const pstr=p=>p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
const centroid=p=>[p.reduce((a,q)=>a+q[0],0)/p.length,p.reduce((a,q)=>a+q[1],0)/p.length];

/* ═══════════ 판정 엔진 — api-spec 11절 하드 룰 13개 ═══════════ */
const drug=id=>DRUGS.find(d=>d.id===id);
const fld=()=>FIELDS.find(f=>f.id===S.field)||FIELDS[0];
const Z=()=>fld().zones;
const zone=id=>Z().find(z=>z.id===id)||Z()[0];
const zname=z=>z.id+'구역';
const live=z=>z.logs.filter(l=>!l.void);
const addLog=(z,d,u)=>z.logs.push({id:LOGSEQ++,d,u});
const voidLog=id=>{for(const f of FIELDS)for(const z of f.zones)for(const l of z.logs)if(l.id===id)l.void=true};
const addDays=(iso,n)=>{const t=new Date(iso+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);
  return t.toISOString().slice(0,10)};
const md=iso=>{const[,m,d]=iso.split('-');return `${+m}월 ${+d}일`};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

const HASMAX=p=>p==='ok'||p==='stage'||p==='plant';   // 최대 횟수를 가진 변환 구분
function judge(z,cand,today){
  const hist=z.logs.filter(l=>l.d>=z.planted&&!l.void).sort((a,b)=>a.d<b.d?-1:1);
  const none=hist.length===0;
  const ev=(raw,src)=>({raw,src,base:BASE});
  const c1={no:1,state:'GREEN',reason:`배추 ${cand.pest}에 쓸 수 있게 등록된 약입니다.`,ev:ev(null,'농약안전정보시스템 PSIS · SVC01')};

  const PSIS='농약안전정보시스템 PSIS · SVC01';
  let c2;
  if(cand.ps==='ok'){const hv=addDays(today,cand.phi);
    c2={no:2,state:'GREEN',reason:`${md(hv)}부터 수확할 수 있습니다.`,phi:cand.phi,hv,ev:ev(cand.ut,PSIS)};
  }
  /* 심을 때 쓰는 약: 수확이 기준이 아니라 이 항목이 아예 해당되지 않는다 */
  else if(cand.ps==='stage')
    c2={no:2,state:'NA',phi:null,hv:null,ev:ev(cand.ut,PSIS),
        reason:'심을 때 땅에 넣는 약이라 수확 전 일수가 없습니다. 이미 자라는 중이면 지금 쓰는 약이 아닙니다.'};
  /* 심은 날이 기준인 약: 수확이 아니라 정식일로 센다 */
  else if(cand.ps==='plant'){const due=addDays(z.planted,cand.pw), over=today>due;
    c2={no:2,state:over?'RED':'GREEN',phi:null,hv:null,due,ev:ev(cand.ut,PSIS),
        reason:over?`심은 날(${md(z.planted)})부터 ${cand.pw}일까지 쓰는 약입니다. ${md(due)}이 지났습니다.`
                   :`심은 날부터 ${cand.pw}일까지 씁니다. ${md(due)}까지입니다.`};
  }
  else c2={no:2,state:'UNKNOWN',phi:null,hv:null,ev:ev(cand.ut,PSIS),
    reason:cand.ps==='failed'?'포장지에 적힌 시기를 날짜로 바꾸지 못했습니다.':'수확 며칠 전까지인지 적혀 있지 않습니다.'};

  const rows=cand.ing.map(([name])=>{
    let used=0,lim=[];
    for(const l of hist){const h=drug(l.u);
      if(!h.ing.some(([n])=>n===name))continue;
      used++;                                                            // 처리법 무관
      if(h.rt===cand.rt&&HASMAX(h.ps)&&h.max!=null)lim.push(h.max);      // 한도는 같은 처리법만
    }
    if(cand.max!=null)lim.push(cand.max);
    const limit=lim.length?Math.min(...lim):null;
    return{name,rt:cand.rt,used,limit,rem:limit==null?null:limit-used};
  });
  let c3;
  if(!HASMAX(cand.ps)||cand.max==null)
    c3={no:3,state:'UNKNOWN',reason:'몇 번까지 쓸 수 있는지 확인하지 못했습니다.',rows,ev:ev(cand.uc,'농약안전정보시스템 PSIS · SVC01')};
  else if(none)
    c3={no:3,state:'UNKNOWN',reason:'이 구역에 뿌린 기록이 없습니다.',rows,ev:ev(cand.uc,'농약안전정보시스템 PSIS · SVC01')};
  else{
    const w=rows.reduce((a,b)=>(a.rem??9)<=(b.rem??9)?a:b);
    const over=rows.some(r=>r.rem!=null&&r.rem<=0);
    c3={no:3,state:over?'RED':'GREEN',rows,ev:ev(cand.uc,'농약안전정보시스템 PSIS · SVC01'),
        reason:over?`${w.name}을 ${w.used}번 썼습니다. 이번 농사에 ${w.limit}번까지라 더 못 씁니다.`
                   :`${w.name}을 ${w.used}번 썼습니다. 이번 농사에 ${w.limit}번까지라 ${w.rem}번 남았습니다.`};
  }

  const last=hist[hist.length-1];
  const lm=last?drug(last.u).ing.map(([,m])=>m):null, my=cand.ing.map(([,m])=>m);
  let c4;
  if(none) c4={no:4,state:'UNKNOWN',reason:'직전에 무엇을 뿌렸는지 알 수 없습니다.',moa:my,last:null,
    ev:ev(null,'농림축산식품부 PLS 안내')};
  else{const dup=my.filter(m=>lm.includes(m));
    c4={no:4,state:dup.length?'AMBER':'GREEN',moa:my,last:lm,ev:ev(null,'농림축산식품부 PLS 안내 · IRAC v11.5'),
        reason:dup.length?`직전에 뿌린 ${drug(last.u).b}와 같은 ${dup.join('·')}번 계통입니다.`
                        :`직전은 ${lm.join('·')}번, 이번은 ${my.join('·')}번. 계통이 다릅니다.`};
  }
  const cs=[c1,c2,c3,c4];
  const state=cs.some(c=>c.state==='RED')?'RED'
             :cs.some(c=>c.state==='NA')?'NA'            // 「해당 없음」은 통과로 올리지 않는다
             :cs.some(c=>c.state==='UNKNOWN')?'UNKNOWN'
             :cs.some(c=>c.state==='AMBER')?'AMBER':'GREEN';
  return{cand,state,checks:cs};
}

/* ═══════════ 표시 공통 ═══════════ */
const LBL={GREEN:'가능',AMBER:'주의',RED:'불가',UNKNOWN:'확인 필요',NA:'심을 때'};
const ORD={GREEN:0,AMBER:1,NA:2,UNKNOWN:3,RED:4};
const CTITLE={1:'등록',2:'시기',3:'횟수',4:'계통'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const moa=c=>`<span class="moa"><span class="kr">계통 ${c}</span></span>`;
const moaFull=c=>`<span class="moa"><span class="kr">계통 ${c}</span><span class="in">${MOA[c]||'코드'}</span></span>`;
const chip=s=>`<span class="chip ${s}">${LBL[s]}</span>`;
const listFor=name=>DRUGS.filter(d=>d.pest===name);
const pestRow=name=>PESTDB.find(p=>p[0]===name);
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};

function dist(z){
  const L=z.logs.filter(l=>l.d>=z.planted&&!l.void),n=L.length,m={};
  for(const l of L)for(const[,c]of drug(l.u).ing)m[c]=(m[c]||0)+1;
  return{n,rows:Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([c,k])=>({c,k,s:k/n}))};
}
function alts(z,v){
  const mine=v.cand.ing.map(([,m])=>m);
  return listFor(v.cand.pest).filter(d=>d.id!==v.cand.id&&!d.ing.some(([,m])=>mine.includes(m)))
    .map(d=>judge(z,d,TODAY)).filter(x=>x.state==='GREEN');
}
const keyReason=v=>(v.checks.find(c=>c.state==='RED')||v.checks.find(c=>c.state==='NA')
  ||v.checks.find(c=>c.state==='UNKNOWN')||v.checks.find(c=>c.state==='AMBER')||v.checks[2]).reason;

function checkBody(c){
  let b='';
  if(c.no===2&&c.hv) b+=`<p style="margin:0">오늘 뿌리면 <b>${c.hv}</b>부터 딸 수 있습니다. 마지막으로 뿌리고 ${c.phi}일은 지나야 합니다.</p>`;
  if(c.no===3&&c.rows.length){
    b+=`<table class="ing"><thead><tr><th>성분</th><th>뿌리는 법</th><th>쓴 횟수</th><th>최대</th><th>남음</th></tr></thead><tbody>
      ${c.rows.map(r=>`<tr><td>${r.name}</td><td>${r.rt}</td><td>${r.used}</td><td>${r.limit??'—'}</td>
      <td class="${r.rem!=null&&r.rem<=0?'out':''}">${r.rem??'—'}</td></tr>`).join('')}</tbody></table>`;
    if(c.rows.length>1) b+=`<p style="margin:0;color:var(--ink-2)">성분이 둘인 약이라 성분마다 따로 셉니다.</p>`;
  }
  if(c.no===4) b+=`<div class="flow">직전 ${c.last?c.last.map(moaFull).join(' '):'기록 없음'} 다음 ${c.moa.map(moaFull).join(' ')}</div>
    <p style="margin:0;color:var(--ink-2)">계통은 약이 벌레를 죽이는 방식입니다.
      이름이 달라도 번호가 같으면 같은 계통이고, 같은 계통만 거듭 쓰면 약이 잘 안 듣게 됩니다.
      번호는 농약 포장에 적힌 작용기작 번호를 씁니다.</p>`;
  b+=`<div class="evid">${c.ev.raw?`<span>원문 <b>「${esc(c.ev.raw)}」</b></span>`:''}
      <span>${c.ev.src}</span><span>자료 기준일 ${c.ev.base}</span></div>`;
  return b;
}
/* 사진이 아니라 구분 표식입니다. 실제 사진 유무는 캡션으로 따로 말한다 */

  const g=p[1]==='병'
   ? `<path d="M8 31 Q17 7 30 11 Q42 15 40 32 Q24 41 8 31Z" fill="#dfe6cf" opacity=".92"/>
      <path d="M19 19 Q28 14 32 23 Q30 31 21 29 Q16 24 19 19Z" fill="#6b5a3a" opacity=".85"/>`
   : `<path d="M24 15 v20" stroke="#7b8f66" stroke-width="1.5"/>

      <ellipse cx="24" cy="26" rx="8" ry="11" fill="#2c3330"/><ellipse cx="24" cy="14" rx="5" ry="4.5" fill="#20251f"/>`;

const photoTag=p=>{
  const v=p[5];
  if(!v) return `<span class="tag no">도감에 없음</span>`;
  if(v==='사진 없음') return `<span class="tag no">사진 없음</span>`;
  if(v==='배추') return `<span class="tag">배추 사진 있음</span>`;
  return `<span class="tag">${esc(v.replace('(',' '). replace(')',''))} 사진</span>`;
};
const timeTag=p=>{
  const [,,,,,,mon,grade]=p;
  if(!grade||!mon.trim()) return `<span class="tag no">나오는 시기 모름</span>`;
  const m=mon.replace(/\s/g,'').split(',').join('·')+'월';
  return grade==='경보'
    ? `<span class="tag alert">예전 경보 ${m}</span>`
    : `<span class="tag">도감에 적힌 시기 ${m}</span>`;
};
/* FR-201 부위 필터 */
const PARTS=[['전체',null],['잎','잎'],['줄기','줄기'],['덩이·뿌리','덩이|뿌리'],['벌레가 보임','벌레']];
function pestList(){
  const q=(S.q||'').trim();
  return PESTDB.filter(p=>{
    if(S.part){const re=new RegExp(S.part); if(!re.test(p[3]))return false}
    if(q&&!p[0].includes(q)&&!(p[2]||'').toLowerCase().includes(q.toLowerCase()))return false;
    return true;
  });
}

const PARCELS=[['0,0 142,0 150,58 0,78',1],['142,0 272,0 282,50 150,58',3],['272,0 400,0 400,66 282,50',2],
 ['0,78 150,58 112,148 0,168',2],['150,58 236,52 200,136 112,148',6],['236,52 282,50 286,126 200,136',3],
 ['282,50 400,66 400,158 286,126',1],['400,158 400,232 302,236 286,126',4],['400,232 400,292 300,300 302,236',2],

 ['300,300 400,292 400,398 311,402',2],['0,332 130,426 120,440 0,440',4],

].map(([s,f],i)=>({id:i+1,f,p:s.split(' ').map(t=>t.split(',').map(Number))}));
const FILLS=['var(--m-1)','var(--m-2)','var(--m-3)','var(--m-4)','var(--m-5)','var(--m-6)'];

function mapSVG(o={}){
  const {sel=null,pick=false,preview=null,vb='0 0 400 440',par='xMidYMid slice',cls=''}=o;
  const taken=new Set(FIELDS.map(f=>f.parcel).filter(Boolean));
  let s=`<svg class="${cls}" viewBox="${vb}" preserveAspectRatio="${par}" role="img"
    aria-label="${pick?'등록할 수 있는 필지를 보여주는 지도':'밭 경계와 구역을 보여주는 지도'}">
    <rect x="-200" y="-200" width="900" height="900" fill="var(--m-bg)"/>`;
  for(const pa of PARCELS){
    const on=pick&&S.pick===pa.id, used=taken.has(pa.id);
    s+=`<polygon ${pick&&!used?`data-parcel="${pa.id}" style="cursor:pointer"`:''}
      points="${pstr(pa.p)}" fill="${on?'rgba(31,79,216,.5)':FILLS[pa.f%FILLS.length]}"
      stroke="var(--m-edge)" stroke-width="${on?2.6:1}" stroke-opacity="${on?1:.34}"/>`;
    if(pick&&!used) s+=`<text x="${centroid(pa.p)[0]}" y="${centroid(pa.p)[1]}" text-anchor="middle"
      class="z-sub">${ha(pa.p).toFixed(2)} ha</text>`;
  }
  s+=`<path d="M48 0 C40 110 58 250 36 440" fill="none" stroke="var(--m-edge)" stroke-width="7" stroke-opacity=".3"/>
      <path d="M48 0 C40 110 58 250 36 440" fill="none" stroke="var(--m-edge)" stroke-width="2"
        stroke-opacity=".5" stroke-dasharray="9 7"/>`;
  for(const f of FIELDS){
    const cur=f.id===S.field;
    s+=`<polygon points="${pstr(f.poly)}" fill="none" stroke="#fff" stroke-width="${cur?3.4:2}"
      stroke-opacity="${cur?.95:.55}" stroke-linejoin="round"/>`;
    if(!cur)continue;
    f.zones.forEach((z,i)=>{
      const p=zonePoly(f,i), on=z.id===sel, n=live(z).length, c=centroid(p);
      s+=`<g style="cursor:pointer" data-zone="${z.id}">
        <polygon points="${pstr(p)}" fill="${on?'rgba(31,79,216,.46)':'rgba(255,255,255,.1)'}"
          stroke="#fff" stroke-width="${on?2.6:1.5}" stroke-opacity="${on?1:.75}"
          ${n===0?'stroke-dasharray="7 5"':''} stroke-linejoin="round"/>
        <text class="z-lbl" x="${c[0]}" y="${c[1]}" text-anchor="middle">${zname(z)}</text>
        <text class="z-sub" x="${c[0]}" y="${c[1]+15}" text-anchor="middle">${n?`이력 ${n}건`:'기록 없음'}</text>
      </g>`;
    });
  }
  if(preview){
    const {poly,n}=preview, tmp={poly,zones:Array(n).fill(0)};
    s+=`<polygon points="${pstr(poly)}" fill="rgba(31,79,216,.3)" stroke="#fff" stroke-width="3"/>`;
    for(let i=0;i<n;i++){const p=zonePoly(tmp,i),c=centroid(p);
      s+=`<polygon points="${pstr(p)}" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="6 4"/>
          <text class="z-sub" x="${c[0]}" y="${c[1]}" text-anchor="middle">${String.fromCharCode(65+i)}</text>`}
  }
  return s+`</svg>`;
}

const band=r=>r>=60?'hi':r>=35?'mid':'lo';
const bandFill=r=>r>=60?'var(--bad)':r>=35?'var(--warn)':'var(--ok)';
const prng=s=>()=>(s=s*16807%2147483647)/2147483647;
function inPoly(x,y,p){let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];
    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function scatter(p,n,seed){
  const r=prng(seed),xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const out=[];let g=0;
  while(out.length<n&&g++<n*80){const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0);
    if(inPoly(x,y,p))out.push([x,y])}
  return out;
}

let S={proto:'O',view:'home',stack:[],field:1,zone:'A',pest:MOTH,drug:1,part:null,q:'',
  saved:false,cases:false,bk:null,myun:'dg',wx:true,dup:false,pick:null,ocr:false,ocrPick:null,
  guide:false, nf:{crop:'배추',planted:'2026-09-01',n:3}};
const go=v=>{S.stack.push(S.view); S.view=v};

function render(){
  document.getElementById('thesis').innerHTML=THESIS[S.proto];
  for(const b of document.querySelectorAll('.tabs button'))
    b.setAttribute('aria-current',String(b.dataset.proto===S.proto));
  const st=document.getElementById('stage');
  st.className=S.proto==='A'?'stage':'stage wide';
  const G=S.guide?guideCard():'';
  if(S.proto==='O'){st.innerHTML=overview()+G; return}
  if(S.proto==='B'){st.innerHTML=pcView()+G; return}
  if(S.proto==='C'){st.innerHTML=dashView()+G; return}
  const V={pest:aPest,vector:aVector,drugs:aDrugs,detail:aDetail,logs:aLogs,paper:aPaper,
           newfield:aNewField,setup:aSetup};
  st.innerHTML=`<div class="app">${(V[S.view]||aHome)()}</div>`+G;
}
function refocusQ(){
  const q=document.getElementById('q');
  if(q){q.focus(); q.setSelectionRange(q.value.length,q.value.length)}
}
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  S.q=e.target.value; render(); refocusQ();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='nfc') S.nf.crop=t.value;
  else if(t.id==='nfd') S.nf.planted=t.value;
  else if(t.dataset.planted){const z=zone(t.dataset.planted); if(t.value){z.planted=t.value; render()}}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-proto],[data-view],[data-back],[data-zone],[data-field],[data-drug],'+
    '[data-pest],[data-part],[data-q],[data-cases],[data-case],[data-save],[data-dup],[data-bk],'+
    '[data-wx],[data-void],[data-add],[data-ocr],[data-ocrpick],[data-ocrsave],[data-reset],'+
    '[data-myun],[data-parcel],[data-nfn],[data-newfield],[data-split],[data-guide]');
  if(!t)return;
  const d=t.dataset, pc=S.proto==='B', z=zone(S.zone);

  if(d.guide!=null){const g=d.guide==='1'; if(g===S.guide)return; S.guide=g}
  else if(d.proto){S.proto=d.proto; S.view='home'; S.stack=[]; S.saved=false; S.cases=false; S.dup=false; S.guide=false}
  else if(d.view!=null){S.cases=false; if(S.proto==='A')go(d.view)}
  else if(d.back!=null){S.view=S.stack.pop()||'home'; S.saved=false; S.bk=null; S.dup=false; S.ocr=false}
  else if(d.zone){S.zone=d.zone; S.saved=false; S.dup=false}
  else if(d.field){S.field=+d.field; S.zone=Z()[0].id; S.saved=false; S.dup=false}
  else if(d.drug){S.drug=+d.drug; S.pest=drug(+d.drug).pest; S.saved=false; S.dup=false; S.bk=null;
    if(!pc&&S.view!=='detail')go('detail')}
  else if(d.pest!=null){
    S.pest=d.pest; S.q=''; S.saved=false; S.dup=false; S.bk=null;
    const L=listFor(S.pest); S.drug=L.length?L[0].id:null;
    if(!pc){ if(VECTORS[S.pest]&&S.view!=='vector') go('vector');
             else if(S.view!=='drugs') go('drugs'); }}
  else if(d.part!=null){S.part=d.part||null}
  else if(d.q!=null){S.q=''}
  else if(d.cases!=null) S.cases=d.cases==='1';
  else if(d.case!=null){const c=CASES[+d.case];
    S.zone=c.z; S.pest=c.p; S.drug=c.d; S.saved=false; S.cases=false; S.dup=false; S.bk=null;
    if(!pc){S.stack=[]; S.view='detail'}}
  else if(d.save!=null){
    if(d.save==='dup') S.dup=true;
    else{addLog(z,TODAY,S.drug); S.saved=true; S.dup=false}}
  else if(d.dup!=null) S.dup=d.dup==='1';
  else if(d.bk!=null){const k=+d.bk; S.bk=S.bk===k?null:k}
  else if(d.wx!=null) S.wx=d.wx==='1';
  else if(d.void!=null){voidLog(+d.void); S.saved=false}
  else if(d.add!=null){const fd=document.getElementById('fd'),fu=document.getElementById('fu');
    if(fd&&fd.value){addLog(z,fd.value,+fu.value); S.saved=false}}
  else if(d.ocr!=null){S.ocr=d.ocr==='1'; S.ocrPick=null}
  else if(d.ocrpick!=null) S.ocrPick=+d.ocrpick;
  else if(d.ocrsave!=null){const od=document.getElementById('od');
    if(S.ocrPick&&od&&od.value){addLog(z,od.value,S.ocrPick); S.ocr=false; S.ocrPick=null}}
  else if(d.reset!=null){resetAll(); S.field=1; S.zone='A'; S.saved=false; S.dup=false}
  else if(d.myun) S.myun=d.myun;
  else if(d.parcel!=null) S.pick=+d.parcel;
  else if(d.nfn!=null) S.nf.n=Math.min(6,Math.max(1,S.nf.n+ +d.nfn));
  else if(d.newfield!=null){
    const pa=PARCELS.find(x=>x.id===S.pick); if(!pa)return;
    const id=Math.max(...FIELDS.map(f=>f.id))+1;
    FIELDS.push({id,parcel:pa.id,name:`필지 ${pa.id} 밭`,crop:S.nf.crop,poly:pa.p,
      zones:Array.from({length:S.nf.n},(_,i)=>({id:String.fromCharCode(65+i),planted:S.nf.planted,logs:[]}))});
    S.field=id; S.zone='A'; S.pick=null; S.stack=[]; S.view='home'}
  else if(d.split!=null){
    const f=fld(), n=Math.min(6,Math.max(1,f.zones.length+ +d.split));
    if(f.zones.some(x=>live(x).length))return;
    f.zones=Array.from({length:n},(_,i)=>f.zones[i]
      ||{id:String.fromCharCode(65+i),planted:f.zones[0].planted,logs:[]});
    if(!f.zones.some(x=>x.id===S.zone))S.zone=f.zones[0].id}
  render();
});
render();
</script>
